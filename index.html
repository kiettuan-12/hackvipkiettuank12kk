<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡HACK•MOD•TEAM⚡</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0b0202;
            --card-bg: rgba(20, 5, 5, 0.75);
            --border-color: #ff1a1a;
            --text-main: #ffffff;
            --text-sub: #ffb3b3;
            --accent-red: #ff0000;
            --glow: 0 0 15px rgba(255, 0, 0, 0.6);
            --glow-strong: 0 0 25px rgba(255, 0, 0, 0.9);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 20px 10px;
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(120, 0, 0, 0.25), transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(80, 0, 0, 0.2), transparent 50%);
            background-attachment: fixed;
        }

        .container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .header-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: var(--glow);
            backdrop-filter: blur(8px);
            position: relative;
        }

        .site-title {
            color: var(--accent-red);
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 0 0 10px var(--accent-red);
            margin-bottom: 8px;
        }

        .site-status {
            font-size: 13px;
            color: var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background-color: var(--accent-red);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-red);
        }

        .content-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 15px;
            box-shadow: var(--glow);
            backdrop-filter: blur(8px);
        }

        .section-title {
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .mod-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .mod-item {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }

        .mod-item:hover {
            border-color: var(--border-color);
            box-shadow: var(--glow);
        }

        .mod-info {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .mod-icon {
            color: var(--accent-red);
            font-size: 18px;
            width: 24px;
            text-align: center;
        }

        .mod-details {
            display: flex;
            flex-direction: column;
        }

        .mod-name {
            font-weight: 800;
            font-size: 14px;
            color: #fff;
            text-shadow: 0 0 5px rgba(255,255,255,0.3);
        }

        .mod-desc {
            font-size: 11px;
            color: #888;
            margin-top: 2px;
        }

        .btn-view {
            background: transparent;
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-view:hover {
            background: var(--accent-red);
            box-shadow: var(--glow-strong);
        }

        .btn-back {
            background: transparent;
            border: 1px solid #555;
            color: #aaa;
            padding: 8px 15px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 15px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-back:hover {
            border-color: #fff;
            color: #fff;
        }

        .detail-title {
            font-size: 18px;
            color: #fff;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .detail-desc {
            font-size: 13px;
            color: #ccc;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .links-zone {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-dl {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid var(--accent-red);
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 800;
            text-decoration: none;
            text-align: center;
            display: block;
            box-shadow: var(--glow);
            transition: all 0.2s;
        }

        .btn-dl:hover {
            background: var(--accent-red);
            box-shadow: var(--glow-strong);
        }

        /* KHỐI CỘNG ĐỒNG */
        .social-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }

        .social-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 0, 0, 0.3);
            border-radius: 8px;
            text-decoration: none;
            color: #fff;
            transition: 0.3s;
        }

        .social-item:hover {
            background: rgba(255, 0, 0, 0.2);
            border-color: var(--accent-red);
            box-shadow: var(--glow);
        }

        .social-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* BẢNG ADMIN & ĐĂNG NHẬP */
        .admin-panel {
            background: rgba(10, 0, 0, 0.9);
            border: 1px dashed var(--accent-red);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
        }

        .admin-title {
            color: var(--accent-red);
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-bottom: 10px;
        }

        .form-group label {
            font-size: 11px;
            color: #aaa;
        }

        .form-input {
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
        }

        .form-input:focus {
            border-color: var(--accent-red);
            outline: none;
        }

        .btn-save {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
        }

        .btn-google {
            background: #db4437;
            color: #fff;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 10px;
        }

        .btn-logout {
            background: #333;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        /* CSS MỚI CHO TÍNH NĂNG XÓA LINK */
        .admin-link-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid #444;
            padding: 6px 10px;
            border-radius: 4px;
            margin-bottom: 6px;
            font-size: 12px;
        }

        .btn-delete-link {
            background: #cc0000;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: bold;
        }

        .btn-delete-link:hover {
            background: #ff0000;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

                <button class="btn-save" onclick="saveGeneralData()" style="margin-bottom: 15px;">LƯU TÊN & MÔ TẢ</button>

                <!-- KHỐI QUẢN LÝ / XÓA LINK TẢI HIỆN CÓ -->
                <div style="color: #aaa; font-size: 11px; margin-bottom: 6px;">Danh sách Link tải hiện có (Bấm nút XÓA để gỡ):</div>
                <div id="admin-links-manage-zone"></div>

                <hr style="border-color: #333; margin: 15px 0;">

                <div style="color: #aaa; font-size: 11px;">Thêm Link Tải Mới:</div>
                <div class="form-group">
                    <label>Tên nút bấm:</label>
                    <input type="text" id="add-name" class="form-input" placeholder="Ví dụ: 📥 TẢI FILE VIP">
                </div>
                <div class="form-group">
                    <label>Đường link (URL):</label>
                    <input type="text" id="add-link" class="form-input" placeholder="https://...">
                </div>
                <button class="btn-save" onclick="addNewLink()">THÊM LINK TẢI NÀY</button>
            </div>
        </div>
    </div>

    <!-- FIREBASE LIBRARIES -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // EMAIL ADMIN DUY NHẤT ĐƯỢC QUYỀN CHỈNH SỬA
        var ADMIN_EMAIL = "kiettuna26@gmail.com";

        var baseMods = [
            { name: "ĐỊNH VỊ FF OB 54", desc: "ALL ĐỊNH VỊ VIP.", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] },
            { name: "FIX LAG FF", desc: "ĐỒ HỌA BRAZIL CHO MÁY LỎ.", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] },
            { name: "MOD SKIN FF", desc: "ALL SKIN FF", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] },
            { name: "FAKE LAG FF", desc: "KT PING , TREY PING.... ALL FAKE LAG", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] },
            { name: "ALL AIMLOCK", desc: "HỖ TRỢ AIM , NHẸ TÂM....", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] },
            { name: "ALL MENU", desc: "KLEL YUMI,VN CHEAT... ALL MENU", links: [{title: "📥 TẢI XUỐNG FILE MOD", url: "https://www.mediafire.com"}] }
        ];

        var firebaseConfig = {
            apiKey: "AIzaSyBZdO6MEBogNXMBEGPjEMdpRV4sgfSzP-Y",
            authDomain: "hackmod-6d933.firebaseapp.com",
            databaseURL: "https://hackmod-6d933-default-rtdb.firebaseio.com",
            projectId: "hackmod-6d933",
            storageBucket: "hackmod-6d933.firebasestorage.app",
            messagingSenderId: "1039105561920",
            appId: "1:1039105561920:web:f41bd8b326b45cc37bd6a5"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        var database = firebase.database();
        var auth = firebase.auth();
        var currentModsData = [];
        var currentUser = null;

        // XỬ LÝ ĐĂNG NHẬP GOOGLE
        function loginWithGoogle() {
            var provider = new firebase.auth.GoogleAuthProvider();
            auth.signInWithPopup(provider).then(function(result) {
                alert("Đăng nhập thành công: " + result.user.email);
            }).catch(function(error) {
                alert("Lỗi đăng nhập: " + error.message);
            });
        }

        function logoutGoogle() {
            auth.signOut().then(function() {
                alert("Đã đăng xuất!");
            });
        }

        // TỰ ĐỘNG THEO DÕI TRẠNG THÁI ĐĂNG NHẬP
        auth.onAuthStateChanged(function(user) {
            currentUser = user;
            if (user) {
                document.getElementById('btn-login-google').classList.add('hidden');
                document.getElementById('btn-logout-google').classList.remove('hidden');
                document.getElementById('user-email-tag').innerText = user.email;

                if (user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                    document.getElementById('admin-panel-zone').classList.remove('hidden');
                    document.getElementById('inp-site-title').value = document.getElementById('site-header-title').innerText;
                    document.getElementById('inp-site-status').value = document.getElementById('site-header-status').innerText;
                } else {
                    document.getElementById('admin-panel-zone').classList.add('hidden');
                    alert("Tài khoản của bạn không có quyền Admin!");
                }
            } else {
                document.getElementById('btn-login-google').classList.remove('hidden');
                document.getElementById('btn-logout-google').classList.add('hidden');
                document.getElementById('admin-panel-zone').classList.add('hidden');
                document.getElementById('admin-edit-mod-section').classList.add('hidden');
            }
        });

        function saveData(d) {
            if(!currentUser || currentUser.email.toLowerCase() !== ADMIN_EMAIL.toLowerCase()){
                return alert("Bạn không có quyền chỉnh sửa!");
            }
            database.ref('mods').set(d);
        }

        function loadData() {
            return currentModsData.length > 0 ? currentModsData : baseMods;
        }

        function getIcons() {
            return [
                'fa-solid fa-crosshairs',
                'fa-solid fa-bolt',
                'fa-solid fa-shirt',
                'fa-solid fa-signal',
                'fa-solid fa-bullseye',
                'fa-solid fa-bars'
            ];
        }

        function refreshMainScreenTexts() {
            var data = loadData();
            var icons = getIcons();
            var listZone = document.getElementById('mod-list-zone');
            listZone.innerHTML = "";

            for (var i = 0; i < data.length; i++) {
                var item = data[i];
                var iconClass = icons[i % icons.length];
                
                var html = '<div class="mod-item">' +
                           '  <div class="mod-info">' +
                           '    <div class="mod-icon"><i class="' + iconClass + '"></i></div>' +
                           '    <div class="mod-details">' +
                           '      <div class="mod-name">' + item.name + '</div>' +
                           '      <div class="mod-desc">' + item.desc + '</div>' +
                           '    </div>' +
                           '  </div>' +
                           '  <button class="btn-view" onclick="goDetail(' + i + ')">XEM →</button>' +
                           '</div>';
                listZone.innerHTML += html;
            }

            var savedSite = localStorage.getItem('site_info_neon');
            if (savedSite) {
                try {
                    var siteObj = JSON.parse(savedSite);
                    if (siteObj.title) document.getElementById('site-header-title').innerText = siteObj.title;
                    if (siteObj.status) document.getElementById('site-header-status').innerText = siteObj.status;
                } catch(e){}
            }
        }

        function renderAdminLinkList(item) {
            var manageZone = document.getElementById('admin-links-manage-zone');
            manageZone.innerHTML = "";

            if (item.links && item.links.length > 0) {
                for (var l = 0; l < item.links.length; l++) {
                    var linkObj = item.links[l];
                    manageZone.innerHTML += 
                        '<div class="admin-link-item">' +
                        '  <span>' + linkObj.title + '</span>' +
                        '  <button class="btn-delete-link" onclick="deleteLink(' + l + ')">🗑️ XÓA</button>' +
                        '</div>';
                }
            } else {
                manageZone.innerHTML = '<div style="color: #666; font-size: 11px;">Chưa có link nào.</div>';
            }
        }

        function goDetail(idx) {
            var data = loadData();
            var item = data[idx];
            if(!item) return;

            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-detail').classList.remove('hidden');

            document.getElementById('view-title').innerText = item.name;
            document.getElementById('view-desc').innerText = item.desc;

            var btnZone = document.getElementById('dl-buttons-zone');
            btnZone.innerHTML = "";
            if(item.links && item.links.length > 0) {
                for(var i=0; i<item.links.length; i++) {
                    btnZone.innerHTML += '<a href="' + item.links[i].url + '" target="_blank" class="btn-dl">' + item.links[i].title + '</a>';
                }
            }

            document.getElementById('current-mod-idx').value = idx;
            document.getElementById('inp-mod-title').value = item.name;
            document.getElementById('inp-mod-desc').value = item.desc;
            document.getElementById('add-name').value = "";
            document.getElementById('add-link').value = "";

            if (currentUser && currentUser.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('admin-edit-mod-section').classList.remove('hidden');
                document.getElementById('admin-mod-id-label').innerText = idx + 1;
                renderAdminLinkList(item);
            }
        }

        function goMain() {
            document.getElementById('screen-detail').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
            document.getElementById('admin-edit-mod-section').classList.add('hidden');
        }

        function saveSiteInfo() {
            var t = document.getElementById('inp-site-title').value.trim();
            var s = document.getElementById('inp-site-status').value.trim();
            if(!t || !s) return alert("Vui lòng nhập đủ!");

            document.getElementById('site-header-title').innerText = t;
            document.getElementById('site-header-status').innerText = s;

            localStorage.setItem('site_info_neon', JSON.stringify({title: t, status: s}));
            alert("Đã lưu thông tin trang!");
        }

        function addNewLink() {
            var idx = parseInt(document.getElementById('current-mod-idx').value);
            var title = document.getElementById('add-name').value.trim();
            var url = document.getElementById('add-link').value.trim();

            if(!title || !url) return alert("Điền đủ tên và link!");

            var data = loadData();
            if(data[idx]) {
                if(!data[idx].links) data[idx].links = [];
                data[idx].links.push({title: title, url: url});
                saveData(data);
                alert("Đã thêm link thành công!");
                goDetail(idx);
            }
        }

        // HÀM XÓA LINK TẢI
        function deleteLink(linkIndex) {
            var idx = parseInt(document.getElementById('current-mod-idx').value);
            var data = loadData();

            if (data[idx] && data[idx].links) {
                if (confirm("Bạn có chắc chắn muốn xóa nút link này không?")) {
                    data[idx].links.splice(linkIndex, 1); // Xóa link khỏi mảng
                    saveData(data);
                    alert("Đã xóa nút link!");
                    goDetail(idx); // Tải lại thông tin nút
                }
            }
        }

        function saveGeneralData() {
            var idx = parseInt(document.getElementById('current-mod-idx').value);
            var name = document.getElementById('inp-mod-title').value.trim();
            var desc = document.getElementById('inp-mod-desc').value.trim();
            if(!name) return alert("Tên không được để trống!");

            var data = loadData();
            if(data[idx]) {
                data[idx].name = name;
                data[idx].desc = desc;
                saveData(data);
                alert("Đã lưu thông tin chính!");
                goDetail(idx);
            }
        }

        window.onload = function() {
            currentModsData = baseMods;
            refreshMainScreenTexts();

            database.ref('mods').on('value', function(snapshot) {
                var data = snapshot.val();
                if (data && data.length > 0) {
                    currentModsData = data;
                } else {
                    currentModsData = baseMods;
                }
                refreshMainScreenTexts();
            }, function(error) {
                currentModsData = baseMods;
                refreshMainScreenTexts();
            });
        };
    </script>
</body>
</html>
